<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8eef5" stroke-width="0.7"/></pattern>
</defs>
<rect width="1200" height="300" fill="white"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<rect x="50" y="60" width="480" height="120" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="290.0" y="116.0" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">字符级切分</text><text x="290.0" y="136.0" font-size="15" text-anchor="middle" fill="#6b7a8f">^  ,  g  2  |  :   →  5 个词元</text><text x="290.0" y="153.0" font-size="15" text-anchor="middle" fill="#6b7a8f">语义密度低，序列被拉长</text><rect x="670" y="60" width="480" height="120" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="910.0" y="116.0" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">ABCTokenizer</text><text x="910.0" y="136.0" font-size="15" text-anchor="middle" fill="#6b7a8f">^g2   |:   :|   →  2 个词元</text><text x="910.0" y="153.0" font-size="15" text-anchor="middle" fill="#6b7a8f">边界完整，逐字可逆</text><text x="600" y="232" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">K = 4 贪婪最长匹配 + 字符回退，O(C)</text></svg>
