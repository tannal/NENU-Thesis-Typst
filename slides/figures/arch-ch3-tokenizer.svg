<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8eef5" stroke-width="0.7"/></pattern>
</defs>
<rect width="860" height="340" fill="white"/>
<rect width="860" height="340" fill="url(#grid)"/>
<text x="430" y="32" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="700">字符边界与音乐事实边界的错位</text><rect x="30" y="62" width="380" height="96" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="220.0" y="106.0" font-size="14.5" font-weight="600" text-anchor="middle" fill="#1f2933">字符级切分</text><text x="220.0" y="126.0" font-size="12" text-anchor="middle" fill="#6b7a8f">^  ,  g  2  |  :</text><text x="220.0" y="143.0" font-size="12" text-anchor="middle" fill="#6b7a8f">单音符被拆成 4–6 个孤立字符</text><rect x="450" y="62" width="380" height="96" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="640.0" y="106.0" font-size="14.5" font-weight="600" text-anchor="middle" fill="#1f2933">ABCTokenizer</text><text x="640.0" y="126.0" font-size="12" text-anchor="middle" fill="#6b7a8f">^g2    |:    :|</text><text x="640.0" y="143.0" font-size="12" text-anchor="middle" fill="#6b7a8f">修饰音级与复合节拍成为原子词元</text><rect x="60" y="218" width="50" height="42" rx="3" fill="white" stroke="#3c4a5a"/><text x="85" y="246" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">^</text><rect x="122" y="218" width="50" height="42" rx="3" fill="white" stroke="#3c4a5a"/><text x="147" y="246" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">g</text><rect x="184" y="218" width="50" height="42" rx="3" fill="white" stroke="#3c4a5a"/><text x="209" y="246" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">2</text><rect x="246" y="218" width="50" height="42" rx="3" fill="white" stroke="#3c4a5a"/><text x="271" y="246" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">|</text><rect x="308" y="218" width="50" height="42" rx="3" fill="white" stroke="#3c4a5a"/><text x="333" y="246" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">:</text><text x="230" y="296" font-size="12" fill="#6b7a8f" text-anchor="middle" font-weight="400">字符级：5 个词元</text><rect x="520" y="218" width="98" height="42" rx="3" fill="white" stroke="#0f766e" stroke-width="1.8"/><text x="569" y="246" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">^g2</text><rect x="630" y="218" width="98" height="42" rx="3" fill="white" stroke="#0f766e" stroke-width="1.8"/><text x="679" y="246" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="600">|:</text><text x="660" y="296" font-size="12" fill="#6b7a8f" text-anchor="middle" font-weight="400">乐理词法：2 个词元</text></svg>
