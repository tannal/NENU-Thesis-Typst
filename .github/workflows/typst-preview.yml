name: Typst PDF Preview

on:
  pull_request:
    branches: [tm-2024]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst 0.15.1
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          typst --version

      - name: Install fonts and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu fonts-liberation poppler-utils ghostscript

      - name: Compile thesis
        run: |
          mkdir -p build
          typst compile --root . template/thesis.typ build/thesis.pdf

      - name: Extract chapter 3
        run: |
          pdftotext -layout build/thesis.pdf /tmp/thesis.txt
          python3 - <<'PY' > /tmp/range.txt
          pages = open('/tmp/thesis.txt', encoding='utf-8').read().split('\f')
          def head(p):
              return [l.strip() for l in p.splitlines() if l.strip()][:3]
          start = next(i for i, p in enumerate(pages, 1)
                       if '3 基于自回归架构的ABC音乐生成模型基准对比' in p)
          end = next(i for i, p in enumerate(pages, 1)
                     if i > start and '4 模型扩展定律与受控前缀生成研究' in head(p))
          print(start, end - 1)
          PY
          read START END < /tmp/range.txt
          echo "Chapter 3: pages ${START}-${END}"
          gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -dFirstPage=${START} -dLastPage=${END} \
             -sOutputFile=build/chapter3-review.pdf build/thesis.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf-preview
          path: |
            build/thesis.pdf
            build/chapter3-review.pdf
