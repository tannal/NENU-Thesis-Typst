<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="Noto Sans CJK SC, Source Han Sans SC, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8eef5" stroke-width="0.7"/></pattern>
</defs>
<rect width="860" height="300" fill="white"/>
<rect width="860" height="300" fill="url(#grid)"/>
<text x="430" y="30" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="700">LoRA 的低秩旁路</text><rect x="80" y="76" width="220" height="66" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="190.0" y="105.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">冻结权重 W</text><text x="190.0" y="125.0" font-size="11.5" text-anchor="middle" fill="#6b7a8f">d × d，不更新</text><rect x="430" y="60" width="190" height="50" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="525.0" y="81.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">A：d × r</text><text x="525.0" y="101.0" font-size="11" text-anchor="middle" fill="#6b7a8f">可训练</text><rect x="430" y="122" width="190" height="50" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="525.0" y="143.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">B：r × d</text><text x="525.0" y="163.0" font-size="11" text-anchor="middle" fill="#6b7a8f">可训练，零初始化</text><rect x="690" y="90" width="140" height="66" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="760.0" y="119.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">相加</text><text x="760.0" y="139.0" font-size="11" text-anchor="middle" fill="#6b7a8f">W x + BAx</text><line x1="302" y1="109" x2="426" y2="85" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="302" y1="109" x2="426" y2="147" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="622" y1="85" x2="686" y2="108" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="622" y1="147" x2="686" y2="124" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><text x="430" y="214" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">r ≪ d：可训练参数由 d² 降至 2dr</text><text x="430" y="240" font-size="12" fill="#6b7a8f" text-anchor="middle" font-weight="400">d = 4096、r = 16 时由 1.68×10⁷ 降至 1.31×10⁵，压缩约 128 倍</text></svg>
