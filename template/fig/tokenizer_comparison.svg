<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%" style="background: transparent;">
  <defs>
    <style>
      .axis { stroke: #111111; stroke-width: 1.8; }
      .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 3,3; }
      .tick-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .sub-title { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .bar-char { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.2; rx: 3; }
      .bar-bpe  { fill: #f59e0b; stroke: #d97706; stroke-width: 1.2; rx: 3; }
      .bar-ours { fill: #10b981; stroke: #047857; stroke-width: 1.5; rx: 3; }
      .val-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .legend-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Panel 1: Bits-Per-Character (BPC) - Lower is Better -->
  <g transform="translate(40, 50)">
    <text x="120" y="0" class="sub-title">(a) Bits-Per-Character (BPC ↓)</text>
    <line x1="30" y1="230" x2="220" y2="230" class="axis" />
    <line x1="30" y1="20" x2="30" y2="230" class="axis" />

    <!-- Y-ticks (0.0 to 1.0, scale 200px / 1.0 = 200px) -->
    <line x1="30" y1="180" x2="220" y2="180" class="grid" /><text x="24" y="184" text-anchor="end" class="tick-text">0.25</text>
    <line x1="30" y1="130" x2="220" y2="130" class="grid" /><text x="24" y="134" text-anchor="end" class="tick-text">0.50</text>
    <line x1="30" y1="80" x2="220" y2="80" class="grid" /><text x="24" y="84" text-anchor="end" class="tick-text">0.75</text>
    <line x1="30" y1="30" x2="220" y2="30" class="grid" /><text x="24" y="34" text-anchor="end" class="tick-text">1.00</text>

    <!-- Bars (Width 36px) -->
    <!-- Char: 0.7820 -> Height = 0.782 * 200 = 156.4, Y = 230 - 156.4 = 73.6 -->
    <rect x="55" y="73.6" width="36" height="156.4" class="bar-char" />
    <text x="73" y="66" class="val-text">0.782</text>

    <!-- BPE-256: 0.7842 -> Height = 156.8, Y = 73.2 -->
    <rect x="105" y="73.2" width="36" height="156.8" class="bar-bpe" />
    <text x="123" y="66" class="val-text">0.784</text>

    <!-- Ours: 0.4604 -> Height = 92.1, Y = 137.9 -->
    <rect x="155" y="137.9" width="36" height="92.1" class="bar-ours" />
    <text x="173" y="130" class="val-text" fill="#047857">0.460</text>
  </g>

  <!-- Panel 2: 50-Epoch Training Time (Seconds) - Lower is Better -->
  <g transform="translate(340, 50)">
    <text x="120" y="0" class="sub-title">(b) 50-Epoch Training Time (s ↓)</text>
    <line x1="30" y1="230" x2="220" y2="230" class="axis" />
    <line x1="30" y1="20" x2="30" y2="230" class="axis" />

    <!-- Y-ticks (0 to 400s, scale 200px / 400 = 0.5px/s) -->
    <line x1="30" y1="180" x2="220" y2="180" class="grid" /><text x="24" y="184" text-anchor="end" class="tick-text">100</text>
    <line x1="30" y1="130" x2="220" y2="130" class="grid" /><text x="24" y="134" text-anchor="end" class="tick-text">200</text>
    <line x1="30" y1="80" x2="220" y2="80" class="grid" /><text x="24" y="84" text-anchor="end" class="tick-text">300</text>
    <line x1="30" y1="30" x2="220" y2="30" class="grid" /><text x="24" y="34" text-anchor="end" class="tick-text">400</text>

    <!-- Bars -->
    <!-- Char: 386.4s -> H = 193.2, Y = 36.8 -->
    <rect x="55" y="36.8" width="36" height="193.2" class="bar-char" />
    <text x="73" y="30" class="val-text">386.4s</text>

    <!-- BPE: 215.8s -> H = 107.9, Y = 122.1 -->
    <rect x="105" y="122.1" width="36" height="107.9" class="bar-bpe" />
    <text x="123" y="115" class="val-text">215.8s</text>

    <!-- Ours: 174.2s -> H = 87.1, Y = 142.9 -->
    <rect x="155" y="142.9" width="36" height="87.1" class="bar-ours" />
    <text x="173" y="136" class="val-text" fill="#047857">174.2s</text>
  </g>

  <!-- Panel 3: Bar Duration Valid Rate (%) - Higher is Better -->
  <g transform="translate(640, 50)">
    <text x="120" y="0" class="sub-title">(c) Bar Duration Compliance (% ↑)</text>
    <line x1="30" y1="230" x2="220" y2="230" class="axis" />
    <line x1="30" y1="20" x2="30" y2="230" class="axis" />

    <!-- Y-ticks (60% to 100%, scale 200px / 40% = 5px/%) -->
    <text x="24" y="234" text-anchor="end" class="tick-text">60%</text>
    <line x1="30" y1="180" x2="220" y2="180" class="grid" /><text x="24" y="184" text-anchor="end" class="tick-text">70%</text>
    <line x1="30" y1="130" x2="220" y2="130" class="grid" /><text x="24" y="134" text-anchor="end" class="tick-text">80%</text>
    <line x1="30" y1="80" x2="220" y2="80" class="grid" /><text x="24" y="84" text-anchor="end" class="tick-text">90%</text>
    <line x1="30" y1="30" x2="220" y2="30" class="grid" /><text x="24" y="34" text-anchor="end" class="tick-text">100%</text>

    <!-- Bars -->
    <!-- Char: 72.4% -> H = (72.4-60)*5 = 62.0, Y = 168.0 -->
    <rect x="55" y="168.0" width="36" height="62.0" class="bar-char" />
    <text x="73" y="160" class="val-text">72.4%</text>

    <!-- BPE: 88.6% -> H = (88.6-60)*5 = 143.0, Y = 87.0 -->
    <rect x="105" y="87.0" width="36" height="143.0" class="bar-bpe" />
    <text x="123" y="79" class="val-text">88.6%</text>

    <!-- Ours: 96.8% -> H = (96.8-60)*5 = 184.0, Y = 46.0 -->
    <rect x="155" y="46.0" width="36" height="184.0" class="bar-ours" />
    <text x="173" y="38" class="val-text" fill="#047857">96.8%</text>
  </g>

  <!-- Global Shared Legend (Bottom Center) -->
  <g transform="translate(310, 305)">
    <rect x="0" y="0" width="16" height="12" class="bar-char" />
    <text x="24" y="10" class="legend-text">Character (Char)</text>

    <rect x="140" y="0" width="16" height="12" class="bar-bpe" />
    <text x="164" y="10" class="legend-text">Subword (BPE-256)</text>

    <rect x="290" y="0" width="16" height="12" class="bar-ours" />
    <text x="314" y="10" class="legend-text">ABCTokenizer (Ours)</text>
  </g>
</svg>
