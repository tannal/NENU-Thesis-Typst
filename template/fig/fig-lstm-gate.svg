<text x="430" y="30" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="700">LSTM 的门控与加性细胞状态</text><rect x="210" y="66" width="440" height="170" rx="8" fill="white" stroke="#3c4a5a" stroke-width="1.6"/><text x="430" y="92" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">细胞状态 c_t</text><rect x="232" y="108" width="96" height="44" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="280.0" y="126.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2933">遗忘门 f</text><text x="280.0" y="146.0" font-size="11" text-anchor="middle" fill="#6b7a8f">σ</text><rect x="340" y="108" width="96" height="44" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="388.0" y="126.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2933">输入门 i</text><text x="388.0" y="146.0" font-size="11" text-anchor="middle" fill="#6b7a8f">σ</text><rect x="448" y="108" width="96" height="44" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="496.0" y="126.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2933">候选 g</text><text x="496.0" y="146.0" font-size="11" text-anchor="middle" fill="#6b7a8f">tanh</text><rect x="556" y="108" width="72" height="44" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="592.0" y="126.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">输出门 o</text><text x="592.0" y="146.0" font-size="10.5" text-anchor="middle" fill="#6b7a8f">σ</text><rect x="300" y="176" width="260" height="44" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="430.0" y="194.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">c ← f ⊙ c + i ⊙ g</text><text x="430.0" y="214.0" font-size="11" text-anchor="middle" fill="#6b7a8f">加性更新</text><line x1="430" y1="152" x2="430" y2="172" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="100" y1="151" x2="208" y2="151" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><text x="104" y="143" font-size="12" fill="#6b7a8f" text-anchor="start" font-weight="400">x_t</text><line x1="652" y1="151" x2="760" y2="151" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#ah)"/><text x="766" y="155" font-size="12" fill="#6b7a8f" text-anchor="start" font-weight="400">h_t</text><text x="430" y="272" font-size="12" fill="#6b7a8f" text-anchor="middle" font-weight="400">遗忘门偏置 +1：直接通路的局部导数为 diag(f_t)，接近 1 时衰减最小</text></svg>
