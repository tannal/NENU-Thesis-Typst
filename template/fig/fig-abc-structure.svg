<text x="430" y="30" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="700">ABC 记谱法的四层语义结构</text><rect x="30" y="56" width="300" height="176" rx="4" fill="white" stroke="#3c4a5a"/><text x="48" y="82" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">谱头元数据</text><text x="56" y="110" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">X:</text><text x="80" y="110" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">1</text><text x="310" y="110" font-size="11" fill="#6b7a8f" text-anchor="end" font-weight="400">曲目索引</text><text x="56" y="134" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">T:</text><text x="80" y="134" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">The Maid</text><text x="310" y="134" font-size="11" fill="#6b7a8f" text-anchor="end" font-weight="400">标题</text><text x="56" y="158" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">M:</text><text x="80" y="158" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">6/8</text><text x="310" y="158" font-size="11" fill="#6b7a8f" text-anchor="end" font-weight="400">拍号</text><text x="56" y="182" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">L:</text><text x="80" y="182" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">1/8</text><text x="310" y="182" font-size="11" fill="#6b7a8f" text-anchor="end" font-weight="400">单位时值</text><text x="56" y="206" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="700">K:</text><text x="80" y="206" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="400">G</text><text x="310" y="206" font-size="11" fill="#6b7a8f" text-anchor="end" font-weight="400">调号</text><rect x="360" y="56" width="470" height="176" rx="4" fill="white" stroke="#3c4a5a"/><text x="378" y="82" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">乐谱正文</text><rect x="390" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="418" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">G2</text><text x="418" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">音名＋时值</text><rect x="462" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="490" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">A</text><text x="490" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">音名</text><rect x="534" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="562" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">^c</text><text x="562" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">升号＋音名</text><rect x="606" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="634" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">B</text><text x="634" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">音名</text><rect x="678" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="706" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">|</text><text x="706" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">小节线</text><rect x="750" y="100" width="56" height="34" rx="3" fill="white" stroke="#0f766e"/><text x="778" y="122" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">:|</text><text x="778" y="152" font-size="9.5" fill="#6b7a8f" text-anchor="middle" font-weight="400">反复记号</text><text x="378" y="186" font-size="11" fill="#6b7a8f" text-anchor="start" font-weight="400">音高轴：A–G ＋ 八度撇逗 ＋ 升降号</text><text x="378" y="206" font-size="11" fill="#6b7a8f" text-anchor="start" font-weight="400">时间轴：时值后缀（2, /2）与 M/L 联合决定小节容量</text><rect x="30" y="270" width="190" height="70" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="125.0" y="301.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">元数据层</text><text x="125.0" y="321.0" font-size="11" text-anchor="middle" fill="#6b7a8f">调式 / 拍号 / 速度</text><rect x="240" y="270" width="190" height="70" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="335.0" y="301.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">音高轴</text><text x="335.0" y="321.0" font-size="11" text-anchor="middle" fill="#6b7a8f">半音离散标量</text><rect x="450" y="270" width="190" height="70" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="545.0" y="301.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">时间轴</text><text x="545.0" y="321.0" font-size="11" text-anchor="middle" fill="#6b7a8f">有理数时值</text><rect x="660" y="270" width="190" height="70" rx="3" fill="white" stroke="#3c4a5a" stroke-width="1.1"/><text x="755.0" y="301.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">结构层</text><text x="755.0" y="321.0" font-size="11" text-anchor="middle" fill="#6b7a8f">小节线 / 反复</text><text x="430" y="372" font-size="12" fill="#6b7a8f" text-anchor="middle" font-weight="400">四层同时约束生成：文本合法不等于时值合法</text></svg>
