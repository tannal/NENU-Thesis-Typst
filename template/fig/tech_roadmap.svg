<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%" style="background: transparent;">
  <defs>
    <style>
      .panel-box   { stroke: #111111; stroke-width: 1.8; rx: 8; }
      .bg-data     { fill: #eff6ff; stroke: #2563eb; }
      .bg-token    { fill: #fef2f2; stroke: #dc2626; }
      .bg-engine   { fill: #ecfdf5; stroke: #059669; }
      .bg-eval     { fill: #fffbeb; stroke: #d97706; }

      .title-box   { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 5; }
      .text-title  { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .text-bold   { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; }
      .text-dim    { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: middle; }
      .text-code   { fill: #0f172a; font-family: "Courier New", Courier, monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }

      .card-inner  { fill: #ffffff; stroke: #111111; stroke-width: 1.2; rx: 5; }
      .flow-arrow  { stroke: #111111; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .sub-arrow   { stroke: #475569; stroke-width: 1.4; stroke-dasharray: 3,2; fill: none; marker-end: url(#subarrow); }

      .ladder-pill { fill: #d1fae5; stroke: #059669; stroke-width: 1; rx: 3; }
      .ladder-text { fill: #065f46; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; }
    </style>

    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#111111" />
    </marker>
    <marker id="subarrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569" />
    </marker>
  </defs>

  <!-- Overall Flow Arrows between 4 pillars -->
  <line x1="230" y1="240" x2="260" y2="240" class="flow-arrow" />
  <line x1="470" y1="240" x2="500" y2="240" class="flow-arrow" />
  <line x1="710" y1="240" x2="740" y2="240" class="flow-arrow" />

  <!-- ============================================================== -->
  <!-- 1. DATA PIPELINE (Left)                                        -->
  <!-- ============================================================== -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="210" height="430" class="panel-box bg-data" />
    <!-- Header Pill -->
    <rect x="25" y="-12" width="160" height="26" class="title-box" />
    <text x="105" y="6" class="text-title" fill="#1e40af">1. DATA PIPELINE</text>

    <!-- Block 1.1: Raw Corpus -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="180" height="75" class="card-inner" />
      <text x="90" y="22" class="text-bold">Raw Folk Dataset</text>
      <text x="90" y="42" class="text-dim">45,850 ABC Tunes</text>
      <text x="90" y="60" class="text-code">8.24M Tokens (Scarce)</text>
    </g>

    <line x1="105" y1="110" x2="105" y2="135" class="flow-arrow" />

    <!-- Block 1.2: Cyclic Group Z12 Augmentation -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="180" height="150" class="card-inner" />
      <text x="90" y="22" class="text-bold">ℤ₁₂ Cyclic Augmentation</text>
      <text x="90" y="38" class="text-dim">12-Semitone Transposition</text>

      <!-- Mini Circle of Fifths Graphic -->
      <g transform="translate(90, 85)">
        <circle cx="0" cy="0" r="32" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" />
        <circle cx="0" cy="0" r="4" fill="#2563eb" />
        <!-- Rotating Arrow -->
        <path d="M 0,-32 A 32 32 0 0 1 28,15" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#subarrow)" />
        <text x="0" y="-36" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">C</text>
        <text x="36" y="5" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">G</text>
        <text x="18" y="36" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">D</text>
        <text x="-28" y="15" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">F</text>
      </g>
      <text x="90" y="140" class="text-dim">Interval &amp; Meter Invariance</text>
    </g>

    <line x1="105" y1="295" x2="105" y2="320" class="flow-arrow" />

    <!-- Block 1.3: Expanded Dataset -->
    <g transform="translate(15, 325)">
      <rect x="0" y="0" width="180" height="85" class="card-inner" fill="#dbeafe" />
      <text x="90" y="24" class="text-bold" fill="#1e3a8a">Augmented Corpus</text>
      <text x="90" y="46" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">550,200 Tunes</text>
      <text x="90" y="68" class="text-code" fill="#1e40af">~98.9M Tokens (12×)</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 2. TOKENIZATION (Middle-Left)                                  -->
  <!-- ============================================================== -->
  <g transform="translate(260, 25)">
    <rect x="0" y="0" width="210" height="430" class="panel-box bg-token" />
    <rect x="25" y="-12" width="160" height="26" class="title-box" />
    <text x="105" y="6" class="text-title" fill="#b91c1c">2. TOKENIZATION</text>

    <!-- Block 2.1: Input Score Stream -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="180" height="75" class="card-inner" />
      <text x="90" y="20" class="text-bold">Raw ABC Text Stream</text>
      <rect x="15" y="32" width="150" height="30" fill="#f8fafc" stroke="#94a3b8" rx="3" />
      <text x="90" y="52" class="text-code">|: ^F2 A>B c d |</text>
    </g>

    <line x1="105" y1="110" x2="105" y2="135" class="flow-arrow" />

    <!-- Block 2.2: ABCTokenizer -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="180" height="150" class="card-inner" />
      <text x="90" y="22" class="text-bold">ABCTokenizer</text>
      <text x="90" y="38" class="text-dim">Greedy Longest-Match (K≤4)</text>

      <!-- Graphical Slicing Representation -->
      <g transform="translate(15, 52)">
        <rect x="5" y="0" width="30" height="22" fill="#fee2e2" stroke="#ef4444" rx="2" />
        <text x="20" y="15" class="text-code" font-size="10">|:</text>
        <rect x="40" y="0" width="38" height="22" fill="#fee2e2" stroke="#ef4444" rx="2" />
        <text x="59" y="15" class="text-code" font-size="10">^F2</text>
        <rect x="83" y="0" width="30" height="22" fill="#fee2e2" stroke="#ef4444" rx="2" />
        <text x="98" y="15" class="text-code" font-size="10">A&gt;</text>
        <rect x="118" y="0" width="28" height="22" fill="#fee2e2" stroke="#ef4444" rx="2" />
        <text x="132" y="15" class="text-code" font-size="10">B</text>
      </g>

      <line x1="20" y1="90" x2="160" y2="90" stroke="#fca5a5" stroke-dasharray="2,2" />
      <text x="90" y="112" class="text-bold" fill="#991b1b">Fact-Token Boundary</text>
      <text x="90" y="130" class="text-dim">Zero BPE Word Shattering</text>
    </g>

    <line x1="105" y1="295" x2="105" y2="320" class="flow-arrow" />

    <!-- Block 2.3: Compact Vocab Space -->
    <g transform="translate(15, 325)">
      <rect x="0" y="0" width="180" height="85" class="card-inner" fill="#fee2e2" />
      <text x="90" y="24" class="text-bold" fill="#991b1b">Compact Music Vocab</text>
      <text x="90" y="46" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">|V| = 91 Tokens</text>
      <text x="90" y="68" class="text-code" fill="#7f1d1d">[bos, 12, 45, 9, eos]</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. TRAINING & INFERENCE (Middle-Right)                         -->
  <!-- ============================================================== -->
  <g transform="translate(500, 25)">
    <rect x="0" y="0" width="210" height="430" class="panel-box bg-engine" />
    <rect x="25" y="-12" width="160" height="26" class="title-box" />
    <text x="105" y="6" class="text-title" fill="#047857">3. TRAIN &amp; INFERENCE</text>

    <!-- Block 3.1: CUDA train.cu Core -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="180" height="150" class="card-inner" />
      <text x="90" y="22" class="text-bold">Native CUDA Core (train.cu)</text>
      <text x="90" y="38" class="text-dim">cuBLAS Row-Major GEMM</text>

      <!-- Mini Transformer Layer Block -->
      <g transform="translate(20, 48)">
        <rect x="0" y="0" width="140" height="24" rx="3" fill="#f0fdf4" stroke="#059669" />
        <text x="70" y="16" class="text-dim" font-weight="bold">Pre-LN + Causal MHA</text>
        <line x1="70" y1="24" x2="70" y2="34" class="sub-arrow" />
        <rect x="0" y="34" width="140" height="24" rx="3" fill="#f0fdf4" stroke="#059669" />
        <text x="70" y="50" class="text-dim" font-weight="bold">GELU MLP (4d expand)</text>
      </g>
      <text x="90" y="132" class="text-bold" fill="#065f46">Tied LM-Head Softmax</text>
    </g>

    <line x1="105" y1="185" x2="105" y2="205" class="flow-arrow" />

    <!-- Block 3.2: Scaling Ladder -->
    <g transform="translate(15, 210)">
      <rect x="0" y="0" width="180" height="95" class="card-inner" />
      <text x="90" y="20" class="text-bold">Model Scaling Ladder</text>

      <!-- Pills Grid -->
      <g transform="translate(12, 32)">
        <rect x="0" y="0" width="72" height="22" class="ladder-pill" />
        <text x="36" y="15" class="ladder-text">Nano 0.24M</text>
        <rect x="82" y="0" width="72" height="22" class="ladder-pill" />
        <text x="118" y="15" class="ladder-text">Mini 1.15M</text>

        <rect x="0" y="28" width="72" height="22" class="ladder-pill" />
        <text x="36" y="43" class="ladder-text">Base 9.59M</text>
        <rect x="82" y="28" width="72" height="22" class="ladder-pill" />
        <text x="118" y="43" class="ladder-text">Med 25.4M</text>
      </g>
      <text x="90" y="88" class="text-bold" fill="#047857">Large 85.4M ➔ XL 302M</text>
    </g>

    <line x1="105" y1="310" x2="105" y2="330" class="flow-arrow" />

    <!-- Block 3.3: Autoregressive Sampler -->
    <g transform="translate(15, 335)">
      <rect x="0" y="0" width="180" height="75" class="card-inner" fill="#d1fae5" />
      <text x="90" y="22" class="text-bold" fill="#065f46">sample.cu Engine</text>
      <text x="90" y="42" class="text-dim">Key Guard &amp; Top-p/Temp</text>
      <text x="90" y="60" class="text-bold" fill="#047857">Real-time Thinking Stream</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. EVALUATION & OUTPUT (Right)                                 -->
  <!-- ============================================================== -->
  <g transform="translate(740, 25)">
    <rect x="0" y="0" width="220" height="430" class="panel-box bg-eval" />
    <rect x="25" y="-12" width="170" height="26" class="title-box" />
    <text x="110" y="6" class="text-title" fill="#b45309">4. EVALUATION &amp; OUTPUT</text>

    <!-- Track 1: Scaling Law -->
    <g transform="translate(15, 28)">
      <rect x="0" y="0" width="190" height="115" class="card-inner" />
      <text x="95" y="20" class="text-bold">Track 1: Scaling Law Fit</text>

      <!-- Mini Log-log plot -->
      <g transform="translate(40, 32)">
        <line x1="0" y1="55" x2="110" y2="55" stroke="#111111" stroke-width="1.2" />
        <line x1="0" y1="5" x2="0" y2="55" stroke="#111111" stroke-width="1.2" />
        <!-- Curve -->
        <path d="M 5,12 Q 40,38 105,48" fill="none" stroke="#2563eb" stroke-width="2" />
        <circle cx="10" cy="14" r="2.5" fill="#ef4444" />
        <circle cx="35" cy="28" r="2.5" fill="#ef4444" />
        <circle cx="70" cy="42" r="2.5" fill="#ef4444" />
        <circle cx="98" cy="47" r="3" fill="#10b981" />
      </g>
      <text x="95" y="104" class="text-bold" fill="#2563eb">α_N = 0.142 (R²=0.995)</text>
    </g>

    <!-- Track 2: MusPy 9-D -->
    <g transform="translate(15, 155)">
      <rect x="0" y="0" width="190" height="135" class="card-inner" />
      <text x="95" y="20" class="text-bold">Track 2: MusPy 9-D Radar</text>

      <!-- Mini Radar -->
      <g transform="translate(95, 75)">
        <polygon points="0,-35 27,-22 34,10 18,32 -18,32 -34,10 -27,-22" fill="none" stroke="#94a3b8" stroke-width="1" />
        <!-- Target -->
        <polygon points="0,-28 22,-18 28,8 14,26 -14,26 -28,8 -22,-18" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="3,2" />
        <!-- Model -->
        <polygon points="0,-27 24,-17 27,9 15,25 -13,26 -27,7 -20,-19" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-width="1.8" />
      </g>
      <text x="95" y="125" class="text-bold" fill="#047857">Ground Truth Alignment</text>
    </g>

    <!-- Track 3: Acoustic Synthesis -->
    <g transform="translate(15, 302)">
      <rect x="0" y="0" width="190" height="110" class="card-inner" fill="#fef3c7" />
      <text x="95" y="22" class="text-bold" fill="#92400e">Karplus-Strong Waveform</text>

      <!-- Mini Waveform Graphic -->
      <g transform="translate(25, 40)">
        <path d="M 0,15 Q 15,-10 30,15 T 60,15 T 90,15 T 120,15 T 140,15" fill="none" stroke="#d97706" stroke-width="2" />
        <line x1="0" y1="15" x2="140" y2="15" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2,2" />
      </g>
      <text x="95" y="80" class="text-dim">Zero-Dependency DSP Synth</text>
      <text x="95" y="98" class="text-code" fill="#78350f">44.1kHz 16-Bit .WAV</text>
    </g>
  </g>
</svg>
