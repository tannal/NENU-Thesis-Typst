<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: transparent;">
  <defs>
    <style>
      .axis { stroke: #111111; stroke-width: 2; }
      .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4,4; }
      .tick-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .label-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; }
      .legend-text { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .line-rnn { stroke: #ef4444; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .line-lstm { stroke: #f59e0b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .line-trans { stroke: #3b82f6; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .line-ours { stroke: #10b981; stroke-width: 3.2; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="label-text" font-size="17">Model Convergence Comparison: Perplexity (PPL) over 50 Epochs</text>

  <!-- Y Axis: 0 to 30 -->
  <line x1="80" y1="420" x2="740" y2="420" class="axis" />
  <line x1="80" y1="360" x2="740" y2="360" class="grid" />
  <text x="70" y="364" text-anchor="end" class="tick-text">5.0</text>
  <line x1="80" y1="300" x2="740" y2="300" class="grid" />
  <text x="70" y="304" text-anchor="end" class="tick-text">10.0</text>
  <line x1="80" y1="240" x2="740" y2="240" class="grid" />
  <text x="70" y="244" text-anchor="end" class="tick-text">15.0</text>
  <line x1="80" y1="180" x2="740" y2="180" class="grid" />
  <text x="70" y="184" text-anchor="end" class="tick-text">20.0</text>
  <line x1="80" y1="120" x2="740" y2="120" class="grid" />
  <text x="70" y="124" text-anchor="end" class="tick-text">25.0</text>
  <line x1="80" y1="60" x2="740" y2="60" class="grid" />
  <text x="70" y="64" text-anchor="end" class="tick-text">30.0</text>

  <!-- X Axis: 0 to 50 Epochs -->
  <line x1="80" y1="60" x2="80" y2="420" class="axis" />
  <text x="70" y="424" text-anchor="end" class="tick-text">0.0</text>

  <line x1="212" y1="60" x2="212" y2="420" class="grid" />
  <text x="212" y="440" text-anchor="middle" class="tick-text">10</text>
  <line x1="344" y1="60" x2="344" y2="420" class="grid" />
  <text x="344" y="440" text-anchor="middle" class="tick-text">20</text>
  <line x1="476" y1="60" x2="476" y2="420" class="grid" />
  <text x="476" y="440" text-anchor="middle" class="tick-text">30</text>
  <line x1="608" y1="60" x2="608" y2="420" class="grid" />
  <text x="608" y="440" text-anchor="middle" class="tick-text">40</text>
  <line x1="740" y1="60" x2="740" y2="420" class="grid" />
  <text x="740" y="440" text-anchor="middle" class="tick-text">50</text>

  <!-- Axis Labels -->
  <text x="410" y="475" text-anchor="middle" class="label-text">Training Epochs</text>
  <text x="25" y="240" text-anchor="middle" class="label-text" transform="rotate(-90 25,240)">Perplexity (PPL)</text>

  <!-- Curves -->
  <!-- Vanilla RNN: from 29.5 to 7.28 (Y = 420 - 7.28*12 = 332.6) -->
  <path d="M 80,66 Q 130,220 212,285 T 344,316 T 476,328 T 740,332.6" class="line-rnn" />

  <!-- LSTM: from 24.0 to 4.59 (Y = 420 - 4.59*12 = 364.9) -->
  <path d="M 80,132 Q 130,260 212,328 T 344,354 T 476,362 T 740,364.9" class="line-lstm" />

  <!-- Standard Transformer: from 32.0 to 3.37 (Y = 420 - 3.37*12 = 379.5) -->
  <path d="M 80,50 Q 130,240 212,340 T 344,368 T 476,376 T 740,379.5" class="line-trans" />

  <!-- GPT2ABC: from 19.5 to 2.47 (Y = 420 - 2.47*12 = 390.3) -->
  <path d="M 80,186 Q 130,310 212,368 T 344,383 T 476,388 T 740,390.3" class="line-ours" />

  <!-- Legend Box -->
  <g transform="translate(480, 75)">
    <rect x="0" y="0" width="240" height="110" fill="#ffffff" fill-opacity="0.85" stroke="#111111" stroke-width="1.2" rx="4" />
    <line x1="15" y1="22" x2="45" y2="22" class="line-ours" stroke-width="3" />
    <text x="55" y="26" class="legend-text">GPT2ABC (Ours, PPL=2.47)</text>

    <line x1="15" y1="46" x2="45" y2="46" class="line-trans" stroke-width="2.5" />
    <text x="55" y="50" class="legend-text">Standard Transformer (3.37)</text>

    <line x1="15" y1="70" x2="45" y2="70" class="line-lstm" stroke-width="2.5" />
    <text x="55" y="74" class="legend-text">LSTM Baseline (4.59)</text>

    <line x1="15" y1="94" x2="45" y2="94" class="line-rnn" stroke-width="2.5" />
    <text x="55" y="98" class="legend-text">Vanilla RNN (7.28)</text>
  </g>
</svg>
