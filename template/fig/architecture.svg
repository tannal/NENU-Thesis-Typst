<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background: transparent;">
  <defs>
    <style>
      .box { stroke: #111111; stroke-width: 1.8; rx: 6; }
      .box-data { fill: #f3f4f6; }
      .box-proc { fill: #dbeafe; }
      .box-model { fill: #d1fae5; }
      .box-out { fill: #fef3c7; }
      .arrow { stroke: #111111; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .dash-arrow { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
      .text-title { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; }
      .text-desc { fill: #374151; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .text-node { fill: #111111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#111111" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Step 1: Input -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="140" height="150" class="box box-data" />
    <text x="70" y="30" class="text-node" font-size="13">Raw ABC Corpus</text>
    <line x1="15" y1="42" x2="125" y2="42" stroke="#d1d5db" />
    <text x="20" y="65" class="text-desc">X: 1</text>
    <text x="20" y="85" class="text-desc">M: 4/4 | L: 1/8</text>
    <text x="20" y="105" class="text-desc">K: D</text>
    <text x="20" y="125" class="text-desc">|: ^F2 A>B c d |</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="170" y1="235" x2="210" y2="235" class="arrow" />

  <!-- Step 2: ABCTokenizer -->
  <g transform="translate(210, 140)">
    <rect x="0" y="0" width="160" height="190" class="box box-proc" />
    <text x="80" y="28" class="text-node" font-size="13">ABCTokenizer</text>
    <text x="80" y="46" class="text-desc" text-anchor="middle">(Greedy Longest Match)</text>
    <line x1="15" y1="58" x2="145" y2="58" stroke="#93c5fd" />
    <rect x="15" y="70" width="130" height="28" rx="4" fill="#ffffff" stroke="#3b82f6" />
    <text x="80" y="88" class="text-desc" text-anchor="middle" font-weight="bold">Vocab Space: 91</text>
    <text x="20" y="120" class="text-desc">• Atomic Accidental (^F)</text>
    <text x="20" y="140" class="text-desc">• Tied Barlines (|:, :|)</text>
    <text x="20" y="160" class="text-desc">• Token Ids: [bos, 12, ...]</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="370" y1="235" x2="410" y2="235" class="arrow" />

  <!-- Step 3: GPT2ABC Engine -->
  <g transform="translate(410, 50)">
    <rect x="0" y="0" width="240" height="370" class="box box-model" />
    <text x="120" y="30" class="text-node" font-size="15">GPT2ABC Architecture</text>
    <text x="120" y="50" class="text-desc" text-anchor="middle">Decoder-Only Causal Transformer</text>
    <line x1="20" y1="62" x2="220" y2="62" stroke="#6ee7b7" />

    <!-- Sub-blocks -->
    <rect x="25" y="75" width="190" height="36" rx="4" fill="#ffffff" stroke="#10b981" />
    <text x="120" y="98" class="text-node">Token &amp; Pos Embeddings</text>

    <line x1="120" y1="111" x2="120" y2="125" class="arrow" />

    <!-- 12x Block Container -->
    <rect x="20" y="125" width="200" height="155" rx="5" fill="#f0fdf4" stroke="#059669" stroke-dasharray="3,3" />
    <text x="195" y="142" class="text-desc" font-weight="bold">×12</text>

    <rect x="35" y="145" width="170" height="30" rx="3" fill="#ffffff" stroke="#111111" />
    <text x="120" y="165" class="text-desc" text-anchor="middle">Pre-LN + Causal Multi-Head Attn</text>

    <rect x="35" y="185" width="170" height="30" rx="3" fill="#ffffff" stroke="#111111" />
    <text x="120" y="205" class="text-desc" text-anchor="middle">Pre-LN + GELU Feed-Forward</text>

    <text x="120" y="255" class="text-desc" text-anchor="middle" fill="#047857">Residual Connection Stream</text>

    <line x1="120" y1="280" x2="120" y2="300" class="arrow" />

    <rect x="25" y="300" width="190" height="36" rx="4" fill="#ffffff" stroke="#10b981" />
    <text x="120" y="323" class="text-node">Tied LM-Head (Softmax)</text>

    <!-- Weight Tying Curve -->
    <path d="M 215,318 Q 235,210 215,93" class="dash-arrow" />
    <text x="238" y="210" class="text-desc" fill="#065f46" font-size="10" transform="rotate(90 238,210)">Weight Tying</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="650" y1="235" x2="690" y2="235" class="arrow" />

  <!-- Step 4: Inference & Synthesis -->
  <g transform="translate(690, 130)">
    <rect x="0" y="0" width="180" height="210" class="box box-out" />
    <text x="90" y="28" class="text-node" font-size="13">Inference &amp; Rendering</text>
    <line x1="15" y1="42" x2="165" y2="42" stroke="#fcd34d" />
    <rect x="15" y="55" width="150" height="35" rx="4" fill="#ffffff" stroke="#f59e0b" />
    <text x="90" y="77" class="text-desc" text-anchor="middle" font-weight="bold">Top-p / Temp Sampling</text>

    <line x1="90" y1="90" x2="90" y2="105" class="arrow" />

    <rect x="15" y="105" width="150" height="40" rx="4" fill="#ffffff" stroke="#f59e0b" />
    <text x="90" y="123" class="text-desc" text-anchor="middle">Sheet Music Render</text>
    <text x="90" y="137" class="text-desc" text-anchor="middle" font-size="10">(SVG Score / PDF)</text>

    <line x1="90" y1="145" x2="90" y2="160" class="arrow" />

    <rect x="15" y="160" width="150" height="35" rx="4" fill="#ffffff" stroke="#f59e0b" />
    <text x="90" y="182" class="text-desc" text-anchor="middle">Karplus-Strong (.wav)</text>
  </g>
</svg>
